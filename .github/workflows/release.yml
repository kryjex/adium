# Builds, signs, and notarizes a tagged release of Fluorite.app and
# attaches the zip and the DMG to the matching GitHub Release. Only runs on
# manual dispatch from this repository -- never on a pull_request event,
# so a fork's PR can never see the signing secrets below.
#
# Required repository secrets:
#   DEVELOPER_ID_CERTIFICATE_P12       base64 of the Developer ID Application
#                                       .p12 export (Keychain Access > export)
#   DEVELOPER_ID_CERTIFICATE_PASSWORD  password used when exporting the .p12
#   DEVELOPER_ID_APPLICATION_IDENTITY  "Developer ID Application: NAME (TEAMID)"
#   CI_KEYCHAIN_PASSWORD                any throwaway password for the
#                                       temporary CI keychain this job creates
#   APPLE_API_KEY_ID                   App Store Connect API key ID
#   APPLE_API_ISSUER                   App Store Connect API issuer ID
#   APPLE_API_KEY_P8_BASE64            base64 of the downloaded AuthKey_*.p8
#
# The API key needs only the "Developer" role in App Store Connect Users
# and Access -- notarization does not need Admin.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Must be an Apple Silicon runner: `make release` vendors dylibs from
    # /opt/homebrew (see Package.swift's Homebrew prefix search), which is
    # the arm64 Homebrew layout. macOS GitHub-hosted runners are arm64.
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install pidgin glib json-glib gettext dylibbundler create-dmg

      - name: Import Developer ID certificate into a temporary keychain
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo -n "$CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$(security list-keychains -d user | sed 's/"//g')"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      - name: Store notarization credentials
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/private_keys
          echo -n "$APPLE_API_KEY_P8_BASE64" | base64 --decode -o ~/private_keys/AuthKey_$APPLE_API_KEY_ID.p8
          xcrun notarytool store-credentials fluorite-notary \
            --key ~/private_keys/AuthKey_$APPLE_API_KEY_ID.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER"

      - name: Build, sign, and notarize
        env:
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
        run: |
          set -euo pipefail
          # A tag push stamps its version into the bundle; a manual dispatch
          # keeps the version from Packaging/Info.plist.
          VERSION_ARG=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION_ARG="VERSION=${GITHUB_REF_NAME#v}"
          fi
          make release DEVELOPER_ID_APP="$DEVELOPER_ID_APP" NOTARY_PROFILE=fluorite-notary $VERSION_ARG

      - name: Upload to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Fluorite-*.zip
            build/Fluorite-*.dmg
          generate_release_notes: true
