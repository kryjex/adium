<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9B6BE0"/>
      <stop offset="1" stop-color="#5A2FA0"/>
    </linearGradient>
    <linearGradient id="facetTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EFE3FF"/>
    </linearGradient>
  </defs>

  <!-- macOS squircle background -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)"/>

  <!-- Fluorite gem: a classic faceted octahedral silhouette, split into
       three shaded facets (table, left, right) for a 3D sparkle. -->
  <g>
    <!-- center / table facet: catches the most light -->
    <polygon points="400,300 624,300 512,732" fill="url(#facetTop)"/>
    <!-- left facet: mid tone -->
    <polygon points="400,300 286,442 512,732" fill="#CBAAF2"/>
    <!-- right facet: in shadow, darkest -->
    <polygon points="624,300 738,442 512,732" fill="#9D6FDE"/>
    <!-- girdle highlight line -->
    <polygon points="286,442 738,442 700,462 324,462" fill="#7A46C4" opacity="0.55"/>
  </g>

  <!-- outline for definition at small sizes -->
  <polygon points="400,300 624,300 738,442 512,732 286,442"
           fill="none" stroke="#3E1E78" stroke-width="10" stroke-linejoin="round" opacity="0.35"/>
</svg>
